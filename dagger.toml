ignore = [".devenv", "target"]

[modules.rust]
source = "github.com/sagikazarmark/daggerverse-beta/rust"

settings.version = "1.98-slim-trixie"

# All-feature nextest plus doctests, and actual Restate with mocked szamlazz.hu.
# The Rust module detects nextest too; its check enumerates offline features.
# ci.live is manually invoked with a Secret and fresh run id, never a check.
[modules.ci]
source = ".dagger/modules/ci"

settings.container = "rust:container"

[modules.dagger-gha]
source = "github.com/sagikazarmark/daggerverse-beta/dagger-gha"
