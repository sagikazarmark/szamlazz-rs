services:
  restate:
    hostname: restate
    image: docker.restate.dev/restatedev/restate:1.7.8
    ports:
      - 127.0.0.1:9070:9070
      - 127.0.0.1:9071:9071
      - 127.0.0.1:8080:8080
    environment:
      RESTATE_INGRESS__ADVERTISED_ADDRESS: "http://127.0.0.1:8080"
      RESTATE_ADMIN__ADVERTISED_ADDRESS: "http://127.0.0.1:9070"
      # The experimental flags multi-account mode depends on: scopes need
      # protocol v7 to reach the SDK and scoped Virtual Objects, which need
      # vqueues. The e2e harness runs its own container with the same three.
      RESTATE_EXPERIMENTAL_ENABLE_VQUEUES: "true"
      RESTATE_EXPERIMENTAL_ENABLE_PROTOCOL_V7: "true"
      RESTATE_EXPERIMENTAL_ENABLE_SCOPED_VIRTUAL_OBJECTS: "true"
    volumes:
      - restate-data:/restate-data

volumes:
  restate-data:
