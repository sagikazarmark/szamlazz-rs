[package]
name = "szamlazz-agent"
version.workspace = true
description = "Client for the szamlazz.hu Számla Agent"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/upstream"]

[features]
default = []
## Ready-made async client built on reqwest (native and browser wasm).
client-reqwest = ["dep:reqwest"]

[dependencies]
base64 = { workspace = true }
jiff = { workspace = true }
percent-encoding = "2.3.2"
quick-xml = { workspace = true, features = ["overlapped-lists"] }
# reqwest 0.13.2 introduced the current `rustls` platform-verifier feature.
reqwest = { version = "0.13.2", default-features = false, optional = true, features = ["cookies", "rustls"] }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }
thiserror = { workspace = true }
# Zero-allocation lexical checks complement quick-xml's structural reader.
xmlparser = "0.13.6"

[dev-dependencies]
serde_ignored = "0.1.14"
ron = "0.12"
futures-util = "0.3.32"
uuid = { version = "1", features = ["v4"] }
# Linux reads system tzdata; the platform bundle covers Windows/macOS.
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
tokio = { workspace = true, features = ["macros", "rt"] }
ureq = { version = "3", default-features = false }
wiremock = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
