[package]
name = "szamlazz-adatkapcsolat"
version.workspace = true
description = "Receiver for the szamlazz.hu Online Pénzügyi Adatkapcsolat push protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/upstream"]

[features]
default = []
## axum router wiring a Handler to the push protocol. Works on wasm/Cloudflare
## Workers too: on wasm targets the handler future is wrapped in a
## single-thread Send assertion (send_wrapper), the same mechanism as
## `#[worker::send]`.
axum = ["dep:axum", "dep:http", "dep:send_wrapper", "dep:tower"]
## Archiver: a ready-made Handler persisting incoming documents through an
## OpenDAL operator. Enable the storage services you need on your own opendal
## dependency.
opendal = ["dep:opendal", "dep:serde_json"]
## The axum router logs a handler's or a key resolver's error at `warn`
## through `tracing` (the response stays a bare status either way).
tracing = ["dep:tracing"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true }
http = { workspace = true, optional = true }
jiff = { workspace = true }
opendal = { version = "0.58.1", default-features = false, optional = true }
quick-xml = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
subtle = { version = "2.6.1", default-features = false }
thiserror = { workspace = true }
tower = { workspace = true, optional = true, features = ["util"] }
tracing = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6.0", optional = true, features = ["futures"] }

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
http-body-util = { workspace = true }
opendal = { version = "0.58.1", default-features = false, features = ["services-memory"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
