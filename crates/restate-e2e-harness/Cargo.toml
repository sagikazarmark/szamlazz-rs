[package]
name = "restate-e2e-harness"
# Versioned on its own: a test harness for restate_sdk endpoints, not one of
# the szamlazz crates (which share the workspace version).
version = "0.1.0"
description = "End-to-end test harness for restate_sdk endpoints against a real restate-server: server gate and launcher, in-process deployment, ingress, admin API and journal introspection (unix only)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["restate", "testing", "e2e"]
categories = ["development-tools::testing"]

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
restate-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `rt` for the stop-signal handler's own runtime, `signal` for what it waits
# on, `sync` for the sampler's stop channel, `macros` for `select!`, `net` and
# `time` for the deployment's listener and the polls.
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }

# The harness spawns `restate-server` in a process group of its own and kills
# the group with `killpg(2)`.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true

# Released on its own cadence, tagged with its name so the tag never collides
# with the workspace's `v{{version}}`.
[package.metadata.release]
shared-version = false
tag-name = "{{crate_name}}-v{{version}}"
