[package]
name = "restate-szamlazz"
version.workspace = true
description = "Restate services issuing and managing szamlazz.hu documents with durable, idempotent execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["szamlazz", "invoice", "restate", "durable", "hungary"]
categories = ["api-bindings"]

[features]
default = []
## JSON Schema derivation for the contract types (OpenAPI via Restate discovery).
schemars = ["dep:schemars", "restate-sdk/schemars"]
## Constructors that skip validation (`ValidatedWorkerConfig::unchecked`), for test
## harnesses whose policies are sized for a mock. Never enable it in a deployment.
test-util = []

[dependencies]
szamlazz-agent = { workspace = true, features = ["client-reqwest"] }

bytes = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
restate-sdk = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true, features = ["jiff02", "rust_decimal1"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
unicode-normalization = "0.1.25"
# reqwest's URL parser diagnostics, including userinfo it canonicalizes away.
url = "2.5.8"

[dev-dependencies]
futures-util = "0.3.32"
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
uuid = { version = "1", features = ["v4"] }
# The crate itself with `test-util`, so the e2e harness can build the
# sub-floor policies its mock is sized for; a path-only dev-dependency is
# dropped on publish.
restate-szamlazz = { path = ".", features = ["test-util"] }
# The Restate half of the e2e harness (server gate, deployment, ingress,
# admin API, journal, the step-name table check).
restate-e2e-harness = "0.1.0"
static_assertions = "1.1.0"
# `sync` for the e2e harness's fetch hold and send counter (`watch` channels).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
# `env-filter` for the crate docs' subscriber example (`RUST_LOG` + `ReplayAwareFilter`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wiremock = { workspace = true }

[lints]
workspace = true

# `schemars` adds typed request/response schemas to the discovery manifest and is part of the
# public API surface.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
