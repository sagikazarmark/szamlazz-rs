[package]
name = "restate-szamlazz"
version.workspace = true
description = "Restate services issuing and managing szamlazz.hu documents with durable, idempotent execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["szamlazz", "invoice", "restate", "durable", "hungary"]
categories = ["api-bindings"]

[features]
default = []
## JSON Schema derivation for the contract types (OpenAPI via Restate discovery).
schemars = ["dep:schemars", "restate-sdk/schemars"]
## Constructors that skip validation (`ValidatedWorkerConfig::unchecked`), for test
## harnesses whose policies are sized for a mock. Never enable it in a deployment.
test-util = []

[dependencies]
szamlazz-agent = { workspace = true, features = ["client-reqwest"] }

bytes = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
restate-sdk = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true, features = ["jiff02", "rust_decimal1"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
unicode-normalization = "0.1.25"

[dev-dependencies]
# The crate itself with `test-util`, so the e2e harness can build the
# sub-floor policies its mock is sized for; a path-only dev-dependency is
# dropped on publish.
restate-szamlazz = { path = ".", features = ["test-util"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
static_assertions = "1.1.0"
# `sync` for the e2e harness's sampler (a `watch` channel stops it), `signal`
# for its SIGINT/SIGTERM handler, which stops the Restate server it started.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "test-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

# The e2e harness spawns `restate-server` in a process group of its own, kills
# the group with `killpg(2)` and tells a stale container from a concurrent
# run's by whether its starting process is alive (`kill(2)` with no signal).
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }

[lints]
workspace = true

# `schemars` adds typed request/response schemas to the discovery manifest and is part of the
# public API surface.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
